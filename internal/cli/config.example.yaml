# ============================================================================
# roksbnkctl workspace config.yaml — the single declarative input.
#
#   roksbnkctl init example > config.yaml                  # this template
#   roksbnkctl -w <ws> init --config-file config.yaml      # seed a workspace
#
# REQUIRED: ibmcloud.region, ibmcloud.resource_group, prefix, tf_source.type.
# Everything else is optional — omit a block to take roksbnkctl's default.
# Secrets are *_b64 (base64 = OBFUSCATION, not encryption); prefer env / the OS
# keychain in CI (IBMCLOUD_API_KEY, ROKSBNKCTL_BIGIP_PASSWORD,
# ROKSBNKCTL_COS_HMAC_*). Plaintext keys in this file are rejected at load.
# ============================================================================

ibmcloud:
  region: eu-de                 # IBM Cloud region (REQUIRED)
  resource_group: default       # IBM Cloud resource group (REQUIRED)
  # api_key_b64: ""             # base64(API key); prefer the IBMCLOUD_API_KEY env var
  # api_key_source: env         # env | keychain | config | prompt

prefix: acme-eu                 # resource-name prefix for everything this workspace creates (REQUIRED)

cluster:
  create: true                  # true = provision a new ROKS cluster; false = attach to an existing one
  name: acme-eu-roks            # new cluster name, or an existing cluster name/ID when create:false
  # openshift_version: "4.20"   # blank = roksbnkctl default
  # workers_per_zone: 2         # blank = roksbnkctl default (AZ-floor clamped)
  # min_worker_vcpu_count: 16   # worker-flavor auto-select floor (blank = default 16)
  # min_worker_memory_gb: 64    # worker-flavor auto-select floor (blank = default 64)
  #
  # existing_subnet_ids:        # place the cluster in subnets that ALREADY EXIST,
  #   - 0757-aaaa…              #   one per zone, in zone order. Requires
  #   - 0757-bbbb…              #   resources.cluster_vpc { create: false, existing: … } —
  #   - 0757-cccc…              #   a subnet cannot be adopted without its VPC.
  #   For estates that allocate address space centrally: the subnets carry the ACLs
  #   and routing, so adopting the VPC alone still lands the cluster in three subnets
  #   this tool invented. Their zones are read from the subnets themselves.
  #
  # vpc_cidr: 10.242.0.0/16     # address block for a NEW cluster VPC (blank = IBM auto)
  #   Blank lets IBM auto-assign, which gives EVERY VPC in the region the same
  #   prefixes (10.241.0.0/18, 10.241.64.0/18, 10.241.128.0/18). That is fine for one
  #   cluster, but a transit gateway cannot route to two VPCs with overlapping
  #   prefixes — it silently blackholes one. Set a distinct block per cluster when
  #   two clusters will share a gateway. Split into three per-zone /18s (a /16 here),
  #   so /18 is the smallest usable block. Applies at CREATE time only: an existing
  #   VPC's prefixes cannot be changed without replacing its subnets.
  #
  # network_mode: single-nic    # single-nic (default) | multi-nic
  #   How the worker nodes are attached. Omit it and you get single-nic, which is
  #   what every cluster built with this tool so far is — the setting exists to
  #   name that, not to change it.
  #
  #   multi-nic requires a BNK release that expresses it (2.4 and later; see the
  #   support matrix — `roksbnkctl` refuses an unsupported pairing at plan time
  #   rather than failing against a real cluster).
  #
  #   CREATE time only, and unlike vpc_cidr this one is ENFORCED: a cluster is not
  #   converted between modes in place. Changing it on a workspace that already
  #   has a cluster is refused, because what terraform would otherwise plan is a
  #   replacement of the running cluster that reads like an update. To move a
  #   deployment to multi-nic, build a new cluster in a new workspace.

tf_source:
  type: embedded                # embedded | github | local (REQUIRED)

# ---- Reuse existing infrastructure (BYO) -----------------------------------
# Each toggle defaults to create:true. To ADOPT an existing resource instead,
# set create:false and `existing: <name-or-id>`.
resources:
  transit_gateway:   { create: true }   # e.g. { create: false, existing: shared-corp-tgw }
  cluster_vpc:       { create: true }   # e.g. { create: false, existing: r006-vpc-abc123 } — BYO cluster VPC by ID
  registry_cos:      { create: true }
  cert_manager:      { create: true }
  bnk:               { create: true }
  tgw_jumphost:      { create: true }
  cluster_jumphosts: { create: true }
  client_vpc:        { create: true }
  # testing_client_vpc_name: ""         # name the testing client VPC (testing phase)
  # testing_ssh_key_name: ""            # reuse an existing IBM Cloud SSH key for the testing jumphosts
  # testing_jumphost_profile: ""        # pin an instance profile for all jumphosts (blank = auto-select)
  # testing_min_vcpu_count: 4           # jumphost auto-select floor (blank = default 4)
  # testing_min_memory_gb: 8            # jumphost auto-select floor (blank = default 8)
  #
  # Security-group source CIDRs (all optional; empty keeps each plane's own default).
  # *_allowed_cidrs gate a single port; *_inbound_cidrs gate a VPC DEFAULT security
  # group (all protocols and ports). Env: ROKSBNKCTL_<KEY, uppercased>.
  # testing_jumphost_allowed_cidrs: []       # SSH (:22) to the jumphosts. Empty = open (public floating IP, key-only access) — narrow to your public /32 on a shared account
  # testing_client_vpc_inbound_cidrs: []     # testing client VPC default SG. Empty = RFC-1918 (test traffic arrives over the Transit Gateway)
  # cluster_http_allowed_cidrs: []           # :80 on the cluster SG. Empty = open (the ingress/ALB path is meant to be reachable)
  # cluster_vpc_default_sg_inbound_cidrs: [] # cluster VPC default SG. Empty = open (historical) — the one worth narrowing to your private ranges

# ---- BNK install -----------------------------------------------------------
bnk:
  # trusted_profile:            # the IBM Cloud identity the CNE controller assumes
  #   service_account:          # blank derives FLO's own long name; see below
  #   roles: [Viewer, Editor]
  #   The CNE controller manages the VPC network attachments it creates for TMM. It
  #   does that as an IBM Cloud Trusted Profile rather than with a stored API key —
  #   `service_account` names the Kubernetes account allowed to ASSUME the profile,
  #   and `roles` are what it may do, scoped to this cluster's OWN VPC.
  #
  #   Leave service_account BLANK unless you know better. Blank derives the
  #   account FLO actually creates:
  #     f5-cne-controller-<flo_namespace>-f5-cne-controller-serviceaccount
  #
  #   The IAM trust rule is a MATCHER, not a pointer: IBM compares a pod's token
  #   against crn/namespace/name with EQUALS. A name that does not match the
  #   account the controller runs as makes the profile unassumable with NO error
  #   anywhere — it looks correct in the IBM Cloud console and works for nothing.
  #   roksbnkctl cannot rename the account: FLO creates it when it reconciles the
  #   CNEInstance, and that spec has no service-account field.
  #
  #   Safe to leave identical on every cluster: uniqueness comes from the profile
  #   name (which carries the cluster name) and the link's cluster CRN, so the same
  #   account name across an account cannot collide.
  #
  #   Narrowing roles fails at attachment time on a RUNNING cluster, not at apply.
  #   Env: ROKSBNKCTL_TRUSTED_PROFILE_SA / ROKSBNKCTL_TRUSTED_PROFILE_ROLES

  # network:
  #   vlan_prefixlen: 24        # TMM self-IP mask, shared by both VLANs
  #   vlan_prefixlen_external: 23   # optional; overrides the shared value
  #   vlan_prefixlen_internal: 26   # optional; the two VLANs need not match
  #   The mask is INDEPENDENT of the VLAN CIDRs and never derived from them.
  #   Making TMM treat a smaller or larger block as directly connected, then
  #   steering the remainder with static routes, is how a specific traffic
  #   pattern is forced. Nothing validates the two against each other.
  #   Env: ROKSBNKCTL_VLAN_PREFIXLEN{,_EXTERNAL,_INTERNAL}

  manifest_version: 2.3.0-3.2598.3-0.0.170   # BNK manifest (default shown — the BNK 2.3 line)
  # far_repo_url: oci://repo.f5.com/...      # FAR OCI repo for the BNK charts/images
  # flo_namespace: f5-bnk                     # F5 Lifecycle Operator namespace (blank = default)
  # flo_utils_namespace: f5-utils             # F5 utility-components namespace (blank = default)
  # gslb_datacenter_name: ""                  # optional CNEInstance GSLB datacenter name
  # license_mode: connected                   # connected | disconnected | f5licenseproxy
  # cert_manager:                             # override cert-manager coordinates (create toggle stays in resources:)
  #   namespace: cert-manager
  #   version: v1.17.3
  # flp:                                      # F5 License Proxy phase (roksbnkctl flp up)
  #   namespace: f5-license-proxy
  #   vsi:
  #     vpc: r014-…                           # ADOPT an existing VPC, or…
  #     create_vpc: true                      # …have the proxy build its OWN network.
  #     vpc_name:    acme-flp-vpc             #   (mutually exclusive with vpc)
  #     subnet_cidr: 10.250.0.0/24            #   must not overlap anything the
  #                                           #   consuming clusters can already reach —
  #                                           #   a transit gateway blackholes one of two
  #                                           #   overlapping VPCs silently.
  #     The proxy is the component that needs egress to F5, so it is often the FIRST
  #     thing deployed into an air-gapped estate. create_vpc lets it be, instead of
  #     requiring a registry (or anything else) to have made a VPC first.
  #   chart_version: ""
  #   storage_class: ""                       # PVC StorageClass (blank = IBM VPC block default)
  # cis:                                      # optional BIG-IP CIS controller
  #   bigip_url: https://10.1.1.5
  #   bigip_username: admin
  #   bigip_password_b64: ""                  # base64(password); prefer ROKSBNKCTL_BIGIP_PASSWORD env
  # preflight:                                # tunes the checks `bnk up` runs BEFORE it plans
  #   # The per-node reachability gate probes the mirror (and the FLP, when one is
  #   # configured) from every node, in every AZ, before anything pulls an image.
  #   #
  #   # reachability_retry_seconds is how long ONE target may keep failing before the
  #   # verdict is believed. A Transit Gateway attachment is asynchronous: IBM programs
  #   # the routes some time after the connection reports `attached`, and a probe run
  #   # 73s after attach has failed on a path that was healthy minutes later. A success
  #   # ends the retry immediately, so a healthy environment never pays this.
  #   #   raise it  — a fabric that programs routes slowly, or a gateway attached in the
  #   #               same run as the install
  #   #   set it 0  — a static environment where a failure is never a race; one shot
  #   reachability_retry_seconds: 180
  #   #
  #   # reachability_timeout_seconds bounds the wait for EVERY node to report. It is
  #   # clamped to stay above the retry budget: a wait shorter than the retry gives up
  #   # while the probe is still legitimately retrying, and reports a timeout that looks
  #   # like the network but is really this file.
  #   reachability_timeout_seconds: 480
  # network:                                  # per-AZ data-plane addressing (all 6 fields per zone)
  #   zones:
  #     - ext_vlan_cidr: 10.10.1.0/24
  #       int_vlan_cidr: 10.10.2.0/24
  #       int_snat_cidr: 10.10.3.0/24         # SNAT addresses
  #       int_vip_cidr:  10.10.4.0/24         # listener / VIP IPs
  #       external_selfip: 10.10.1.10
  #       internal_selfip: 10.10.2.10

# ---- Gateway phase (optional) ----------------------------------------------
# gateway:
#   app_namespace: my-app
#   backend_service: my-svc
#   backend_port: 80
#   egress_mode: snatpool                     # snatpool | automap | both
#   client_subnet_local:  [10.241.0.0/24]
#   client_subnet_remote: [10.242.0.0/24]

# ---- Orchestration COS (optional) ------------------------------------------
# Where the FAR auth key + subscription JWT live. Blank fields fall back to the
# built-in defaults (bnk-supply-chain / bnk-artifacts / us-south).
# Honoured by BOTH the terraform render and the `registry` FAR resolver.
# cos:
#   instance: bnk-supply-chain
#   bucket: bnk-artifacts
#   region: us-south

# ---- Air-gap registry mirror (optional; PRD 11) ----------------------------
# registry:
#   target: icr                               # openshift | icr | generic  (default icr)
#   icr_namespace: acme-eu                    # default: the prefix
#   # generic_host / generic_repo_prefix / generic_username / generic_password_b64 for target=generic
#   #
#   # A SELF-SIGNED mirror (a co-located Harbor) needs its CA installed on every
#   # cluster node before pulls work. Supply it from the file you generated —
#   # `registry replicate` then never has to learn trust from the network:
#   #   roksbnkctl registry target generic_ca /opt/harbor/certs/harbor.crt
#   generic_ca_b64: LS0tLS1CRUdJTiBDRVJU...     # the CA chain, PEM, base64 (public data)
#   generic_ca_sha256: sha256:ab12...           # its SHA-256; also PINS a captured CA
#   #
#   # With neither set, replicate REFUSES to adopt a self-signed CA it discovered
#   # over the wire (it would become cluster-wide trust). Pass --insecure-capture-ca
#   # to accept trust-on-first-use deliberately.

# ---- Remote state (optional) -----------------------------------------------
state:
  backend: local                              # local | s3 (COS remote state — see the Remote state chapter)
  # s3:
  #   endpoint: https://s3.eu-de.cloud-object-storage.appdomain.cloud
  #   bucket: my-tfstate-bucket
  #   region: eu-de
  #   # HMAC keys come from env: ROKSBNKCTL_COS_HMAC_ACCESS_KEY / _SECRET_KEY

# ---- Agentic mode (optional; see the Agentic mode chapter) ------------------
# Drive this workspace with an AI coding agent under role-scoped personas.
# `roksbnkctl agent init` scaffolds AGENTS.md + personas/ here; `roksbnkctl
# agent <cli>` prints the launch invocation. roksbnkctl embeds no LLM.
# agent:
#   default: claude                           # claude | gemini | aider | openai | pi | opencode
#   llm_endpoint: ""                          # OpenAI-/Anthropic-compatible base URL; blank = the CLI's own config
