# Which combinations of BNK release and cluster network mode are supported.
#
# DATA, NOT CODE, AND NOT TRIBAL KNOWLEDGE. Two version axes vary independently
# here — the BNK release and the IBM platform capability — and they interact.
# Writing the valid cells down is what lets `cluster up` and `bnk up` refuse an
# unsupported pairing at plan time instead of failing against a real cluster.
#
# `contract` lists the cluster-outputs.json schema versions a BNK line can read.
# A line that understands schema 1 can drive clusters created before multi-NIC
# existed; that is what keeps existing deployments working.
#
# Adding a cell means adding a CI plan for it. A cell with no coverage is a claim
# nobody has checked.
lines:
  - bnk: "2.3"
    contract: [1, 2]
    network_modes: [single-nic]
    notes: >-
      The shipped line. Single-NIC only — multi-NIC ROKS changes the F5 network
      attachments and CNEInstance options, which 2.3 does not express.

  # VERIFIED against 2.4.0-EA on 2026-08-21. What was actually run, so the next
  # reader can tell what this cell covers and what it does not:
  #
  #   manifest 2.4.0-EA, FAR repo.f5.com with the non-GA service account,
  #   ROKS OCP 4.20, 3 workers, single-NIC, connected licensing (eval JWT),
  #   `bnk up` on an adopted cluster.
  #
  #   Result: CNEInstance 18/18 conditions True, f5-tmm x3 at 5/5 Running,
  #   bnk-license Active.
  #
  #   RE-VERIFIED 2026-08-23 against a cluster reproducing F5's approved
  #   reference (staging-small-8c-20g): 6 x cx3d.8x20, OCP 4.21, deploymentSize
  #   Tiny, tmmReplicas 3, wholeCluster false with watchNamespaces ["All"],
  #   reference pod placement, TMM_IGNORE_GATEWAYS + DISABLE_HT +
  #   ENABLE_K8S_ROUTES, GATEWAY_API_VERSION 1.5.0, demoMode off.
  #
  #   WHAT THAT RUN DID NOT COVER, recorded because it was later found broken
  #   (#187). Those checks asserted what the install CONTAINS and never what it
  #   must NOT contain, so they all passed on a cluster that was still emitting
  #   the 2.3 network surface — cloud-network-mapping, two F5SPKVlan CRs and the
  #   CLOUD_NETWORK_CONFIGMAP env — alongside the 2.4 model. F5Tmm sat at
  #   Reconciled=False ("failed to get kubeadm-config") and the internal
  #   macvlan NAD it owns was never created, while CNEInstance still reported
  #   18/18 conditions True and every pod Running.
  #
  #   Neither the pod counts, the licence state, nor the CNEInstance spec
  #   conformance can see that. Any future verification of this cell must assert
  #   F5Tmm Reconciled=True and the ABSENCE of the 2.3 objects.
  #
  #   FIVE consecutive clean cluster-lifecycle CLI demo runs, each a cold start:
  #   cluster up, bnk up, testing up + test, then bnk down + bnk up. Every
  #   world-changing command status-checked — an earlier sequence of five
  #   "passes" was discarded once the demos were made to fail on a failed phase.
  #
  #   The teardown namespace repair fired in ALL FIVE runs and in every
  #   teardown between them, so the 2.4 finalizer deadlock is not intermittent:
  #   without that repair a 2.4 cluster cannot be reinstalled into at all.
  #
  #   NOT covered by these five: the CI demo (docker-driven, needs its own
  #   five), mTLS, multi-NIC, disconnected licensing, EgressGateway CRs, and the
  #   contract boundary.
  #
  #   The GATEWAY phase has since been exercised too, on the same cluster:
  #   `gateway up` applies Infra + GatewaySettings and both reach Accepted,
  #   ResolvedRefs and Programmed = True, with the CNEInstance still 18/18 and
  #   the licence still Active afterwards. Running it is what found the three
  #   defects that made it impossible before: the gateway plan failed outright
  #   on 2.4, USE_GATEWAY_SETTINGS was never set so nothing reconciled the CRs,
  #   and the cneinstance_advanced_env override that was meant to let you set it
  #   read by no terraform at all.
  #
  #   Still NOT exercised, and so not claimed: mTLS, multi-NIC, disconnected
  #   licensing, EgressGateway CRs, and the contract boundary.
  #
  # This row originally claimed multi-NIC on the expectation that 2.4 would add
  # it. The BNK 2.4 EA install guide does not: it is single-NIC throughout — one
  # NetworkAttachmentDefinition (ens3-ipvlan-l2, master ens3), one `external-vlan`
  # network in the Infra CR, and no second data-plane interface anywhere. The
  # claim stays withdrawn: the run above was single-NIC, so it is evidence for
  # single-NIC and for nothing else.
  #
  # The contract range remains an EXPECTATION rather than an observation — the
  # run did not exercise a contract boundary. Treat a plan-time pass on it
  # accordingly.
  - bnk: "2.4"
    contract: [1, 2]
    network_modes: [single-nic]
    notes: >-
      Verified against 2.4.0-EA: bnk up reaches 18/18 CNEInstance conditions with
      TMM 5/5 and the licence Active, on a single-NIC OCP 4.20 cluster with
      connected licensing, and `gateway up` brings Infra + GatewaySettings to
      Programmed. Single-NIC only — the 2.4 EA install guide shows no
      multi-NIC path, and the verified run was single-NIC. Drives clusters
      created before multi-NIC existed, so an existing deployment can move to 2.4
      without touching its cluster.
