apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http2-route
  namespace: {{.Namespace}}
spec:
  parentRefs:
  - name: http2-gateway
  hostnames:
  - http2.awsbnkctl.local
  rules:
  - matches:
    - path: {type: PathPrefix, value: /}
    backendRefs:
    - name: h2c-backend
      port: 80
