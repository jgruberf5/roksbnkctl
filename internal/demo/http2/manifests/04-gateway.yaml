apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: http2-gateway
  namespace: demo-http2
spec:
  gatewayClassName: syd-tracer-gatewayclass
  addresses:
  - type: IPAddress
    value: 10.0.10.111
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces: {from: Same}
