# Envoy Gateway pre-seed manifests — applied by `awsbnkctl forge proxy prepare-envoy`
# before forge's Helm deploy so the EnvoyProxy(NodePort) intent is live on first reconcile.
#
# Field-manager: "awsbnkctl" owns spec.parametersRef on the GatewayClass and the
# full EnvoyProxy spec. Forge's later `kubectl apply --server-side --force-conflicts`
# only sets spec.controllerName (identical value) — per SSA spec, omitting parametersRef
# does NOT strip it when another manager owns it. Pre-seed survives.
#
# Order matters: apply EnvoyProxy before GatewayClass (Envoy Gateway docs recommendation).
---
apiVersion: v1
kind: Namespace
metadata:
  name: perf-proxies
---
# EnvoyProxy CR — instructs the Envoy Gateway controller to provision the
# data-plane Service as NodePort with Cluster externalTrafficPolicy.
# externalTrafficPolicy: Cluster is MANDATORY: with Local, only nodes
# running an Envoy pod answer the nodePort; any other node black-holes traffic.
# Name "awsbnkctl-nodeport" is stable across re-runs (idempotent SSA).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: awsbnkctl-nodeport
  namespace: perf-proxies
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: NodePort
        externalTrafficPolicy: Cluster
---
# GatewayClass "eg" — points to the EnvoyProxy above via parametersRef.
# awsbnkctl owns parametersRef; forge owns controllerName (shared, identical value).
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: awsbnkctl-nodeport
    namespace: perf-proxies
