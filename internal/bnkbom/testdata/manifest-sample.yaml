# Synthetic sample mirroring the f5-bigip-k8s-manifest shape (PRD 11) — NOT the
# real F5 component inventory. It exercises the parser's edge cases: the oci://
# helm-repo scheme, the utils/ path alongside charts/, and the trailing-whitespace
# quirk the real manifest carries on some version fields.
f5_helm_repo: oci://repo.f5.com
f5_docker_repo: repo.f5.com
releases:
  - version: 9.9.9-test.0
    helm_charts:
      - name: charts/sample-operator
        version: v1.2.3-0.0.1
      - name: utils/sample-util
        version: 0.9.0
      - name: charts/sample-tmm
        version: 4.5.6-0.0.2
    docker_images:
      - name: images/sample-operator
        version: v1.2.3-0.0.1
      - name: images/sample-tmm
        version: v4.5.6-0.0.2
