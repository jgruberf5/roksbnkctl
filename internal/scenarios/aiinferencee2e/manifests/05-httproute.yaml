apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: scn-aiinference-route
  namespace: {{.Namespace}}
spec:
  parentRefs:
  - name: scn-aiinference-gateway
  hostnames:
  - awsbnkctl-aiinference.local
  rules:
  - matches:
    - path: {type: PathPrefix, value: /}
    backendRefs:
    - name: vllm
      port: 80
