---
# HuggingFace token: mount the hf-token Secret if the model is gated.
# Create it with:
#   kubectl -n {{.Namespace}} create secret generic hf-token \
#     --from-literal=token=<YOUR_HF_TOKEN>
# If the model is public (no gated access needed), this Secret and the
# env var below can be omitted. The Secret is referenced optionally via
# envFrom so the Deployment starts regardless.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: {{.Namespace}}
  labels:
    app: vllm
spec:
  replicas: 1
  # Recreate strategy: prevents RollingUpdate deadlock on single-GPU nodes.
  # A rolling update would stall waiting for the new pod to schedule while the
  # old pod still holds the only GPU. Recreate terminates the old pod first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      # Prevent Kubernetes service-link env vars from shadowing vLLM's own
      # VLLM_PORT env var. Without this, Kubernetes injects
      # VLLM_PORT=tcp://<clusterIP>:80 (from the vllm Service), which vLLM
      # interprets as a URI and raises ValueError on startup.
      enableServiceLinks: false
      # Target GPU nodes: the GPU nodegroup is tainted nvidia.com/gpu=present:NoSchedule
      # and labelled awsbnkctl.io/gpu=true. Both nodeSelector and toleration are required.
      nodeSelector:
        awsbnkctl.io/gpu: "true"
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      containers:
      - name: vllm
        image: vllm/vllm-openai:latest
        args:
        - --model
        - meta-llama/Meta-Llama-3-8B-Instruct
        - --served-model-name
        - llama3
        - --port
        - "8000"
        ports:
        - containerPort: 8000
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
              # optional: true so the pod starts even without the Secret;
              # the model pull will fail at runtime if the model requires auth.
              optional: true
        - name: HUGGING_FACE_HUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
              optional: true
        resources:
          requests:
            nvidia.com/gpu: "1"
            # Sized to fit g5.xlarge allocatable (~3.92 CPU / ~14.4 GiB after
            # kubelet/system/DaemonSet reservations). Verified live 2026-06-13.
            memory: 8Gi
            cpu: "2"
          limits:
            nvidia.com/gpu: "1"
            memory: 14Gi
            cpu: 3500m
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 15
          failureThreshold: 20
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 180
          periodSeconds: 30
          failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: {{.Namespace}}
spec:
  selector:
    app: vllm
  ports:
  - name: http
    port: 80
    targetPort: 8000
