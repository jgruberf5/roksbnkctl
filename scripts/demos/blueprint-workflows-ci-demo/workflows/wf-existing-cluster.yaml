# wf-existing-cluster.yaml — install BNK onto an EXISTING, CONNECTED ROKS cluster
# that is already on a transit gateway. Nothing is provisioned.
#
# BNK Forge blueprint parity: `blueprints/roks-existing-cluster` → modules
# roksbnkctl/cluster-registry, roksbnkctl/bnk-install, roksbnkctl/cwc-guard.
#
# The cluster is ADOPTED, not built: `cluster register` looks it up in IBM Cloud and
# records its identity, which takes seconds instead of the ~40 minutes a build costs.
# Because this workflow never creates the cluster, its teardown never destroys it —
# `bnk down` removes only what was installed.
#
#   argo submit -n bnk-ci --wait workflows/wf-existing-cluster.yaml
#
# Set ROKSBNKCTL_CLUSTER_NAME and ROKSBNKCTL_TRANSIT_GATEWAY_NAME in bnk-env to name
# what to adopt.
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: bnk-existing-cluster-
  namespace: bnk-ci
spec:
  entrypoint: build
  serviceAccountName: bnk-runner
  arguments:
    parameters:
      - name: bnkforge
        value: "true"
      # The cwc guard works around an F5 packaging defect (a single-replica RWO
      # Deployment shipped with RollingUpdate, so the replacement pod cannot attach the
      # volume). Set false once F5 ships `strategy: Recreate`.
      - name: cwc-guard
        value: "true"
  volumes:
    - name: work
      persistentVolumeClaim: { claimName: bnk-work }
  templates:
    - name: build
      steps:
        # ── cluster-registry: adopt, do not create ───────────────────────────────
        - - name: init
            template: rbk
            arguments:
              parameters: [{ name: cmd, value: "init -w bnkconn --non-interactive --override-from-env" }]
        - - name: cluster-register
            template: rbk
            arguments:
              parameters: [{ name: cmd, value: '-w bnkconn cluster register "$ROKSBNKCTL_CLUSTER_NAME" --registry-cos-name "$REGISTRY_COS_NAME"' }]
        # Pull the admin kubeconfig so the k verbs (and the cwc guard) can reach it.
        - - name: kubeconfig-fetch
            template: rbk
            arguments:
              parameters: [{ name: cmd, value: "-w bnkconn kubeconfig --download" }]
        - - name: bnkforge-register
            template: rbk
            when: "{{workflow.parameters.bnkforge}} == true"
            arguments:
              parameters: [{ name: cmd, value: '-w bnkconn bnkforge register --project "$BNKFORGE_PROJECT" --insecure=$BNKFORGE_INSECURE' }]

        # ── bnk-install ──────────────────────────────────────────────────────────
        # Connected: nothing is mirrored, so bnk up renders against far_repo_url.
        # The guard runs AS A SIDECAR of this step — see the bnk-up template.
        - - name: bnk-up
            template: bnk-up
        - - name: bnk-status
            template: rbk
            arguments:
              parameters: [{ name: cmd, value: "-w bnkconn bnk status" }]


    - name: rbk
      inputs:
        parameters:
          - name: cmd
      container:
        image: PLACEHOLDER_RUNNER_IMAGE
        command: [sh, -ec]
        args: ["roksbnkctl {{inputs.parameters.cmd}}"]
        workingDir: /work
        envFrom:
          - configMapRef: { name: bnk-env }
          - secretRef:    { name: bnk-secrets }
        env:
          # ADOPT, never create — this workflow must not be able to build a cluster.
          - { name: ROKSBNKCTL_CLUSTER_CREATE, value: "false" }
          # The mirror is BLANKED for the connected variants, and it has to be done
          # here rather than by omission: bnk-env is shared with the mirror and
          # disconnected workflows, so ROKSBNKCTL_GENERIC_HOST is set for everyone.
          # Left inherited, `init --override-from-env` writes registry.generic_host
          # into this workspace, tf/vars.go then renders EVERY image against the
          # mirror, and a connected cluster that is not on the mirror's gateway
          # cannot reach it — seen as cert-manager pulling 10.241.0.4/... until
          # `bnk up` hit its 600s deadline. OverrideFromEnv skips empty values, so
          # blank leaves a fresh workspace with no registry, which is what
          # "connected" means: render against far_repo_url.
          #
          # ROKSBNKCTL_REGISTRY_TARGET must be blanked TOO, and it is the one that
          # actually matters. envoverride.go's registryCfg() CREATES ws.Registry the
          # moment target is set, so `target: generic` alone materialises a registry
          # block even with every generic_* value empty. `bnk up` then finds a mirror
          # configured, looks for the mirror RECORD this workspace never wrote, and
          # dies with:
          #
          #   a registry mirror is configured for this workspace but this workspace
          #   has no record of it.
          #
          # ~37 minutes in, after the cluster was already built. Blanking the six
          # generic_* values without this one is not enough.
          - { name: ROKSBNKCTL_REGISTRY_TARGET,     value: "" }
          - { name: ROKSBNKCTL_GENERIC_HOST,        value: "" }
          - { name: ROKSBNKCTL_GENERIC_REPO_PREFIX, value: "" }
          - { name: ROKSBNKCTL_GENERIC_USERNAME,    value: "" }
          - { name: ROKSBNKCTL_GENERIC_PASSWORD,    value: "" }
          - { name: ROKSBNKCTL_GENERIC_CA_B64,      value: "" }
          - { name: ROKSBNKCTL_GENERIC_CA_SHA256,   value: "" }
          - { name: ROKSBNKCTL_HOME, value: "/work/.roksbnkctl" }
          - { name: HOME,            value: "/home/runner" }
        volumeMounts:
          - { name: work, mountPath: /work }

    # `bnk up` WITH the cwc guard running alongside it.
    #
    # The guard cannot be a step after this one, because the deadlock is what makes
    # THIS step fail: the F5 Lifecycle Operator rolls f5-spk-cwc part-way through the
    # install, the rollout wedges, the License CR never reaches Active, and `bnk up`'s
    # license gate (tfx wait --for status.state=Active, 15m) times out. A post-install
    # remedy would never be reached. So the guard is a SIDECAR — Argo starts it with the
    # main container and kills it when `bnk up` returns.
    #
    # Only the workflows that REUSE an existing cluster carry it. A freshly built
    # cluster has no prior volume attachments for the replacement pod to collide with,
    # so wf-new-cluster*.yaml deliberately do not.
    - name: bnk-up
      container:
        image: PLACEHOLDER_RUNNER_IMAGE
        command: [sh, -ec]
        args: ["roksbnkctl -w bnkconn bnk up --auto"]
        workingDir: /work
        envFrom:
          - configMapRef: { name: bnk-env }
          - secretRef:    { name: bnk-secrets }
        env:
          - { name: ROKSBNKCTL_CLUSTER_CREATE, value: "false" }
          # The mirror is BLANKED for the connected variants, and it has to be done
          # here rather than by omission: bnk-env is shared with the mirror and
          # disconnected workflows, so ROKSBNKCTL_GENERIC_HOST is set for everyone.
          # Left inherited, `init --override-from-env` writes registry.generic_host
          # into this workspace, tf/vars.go then renders EVERY image against the
          # mirror, and a connected cluster that is not on the mirror's gateway
          # cannot reach it — seen as cert-manager pulling 10.241.0.4/... until
          # `bnk up` hit its 600s deadline. OverrideFromEnv skips empty values, so
          # blank leaves a fresh workspace with no registry, which is what
          # "connected" means: render against far_repo_url.
          - { name: ROKSBNKCTL_GENERIC_HOST,        value: "" }
          - { name: ROKSBNKCTL_GENERIC_REPO_PREFIX, value: "" }
          - { name: ROKSBNKCTL_GENERIC_USERNAME,    value: "" }
          - { name: ROKSBNKCTL_GENERIC_PASSWORD,    value: "" }
          - { name: ROKSBNKCTL_GENERIC_CA_B64,      value: "" }
          - { name: ROKSBNKCTL_GENERIC_CA_SHA256,   value: "" }
          - { name: ROKSBNKCTL_HOME, value: "/work/.roksbnkctl" }
          - { name: HOME,            value: "/home/runner" }
        volumeMounts:
          - { name: work, mountPath: /work }
      sidecars:
        # F5 DEFECT. f5-spk-cwc is a single-replica Deployment that mounts a
        # ReadWriteOnce PVC but ships strategy RollingUpdate. maxSurge rounds up to 1,
        # so the replacement pod is scheduled BEFORE the incumbent is terminated;
        # landing on another node it cannot attach the volume ("Multi-Attach error"),
        # the rollout never completes, and licensing never activates.
        #
        # The guard forces strategy=Recreate (old pod terminated first, volume freed)
        # and clears an existing deadlock by cycling replicas 0→1. It is silent,
        # self-terminating, and exits 0 unconditionally so it can never fail the step —
        # on a cluster that does not deadlock it simply watches until `bnk up` finishes.
        #
        # Uses `roksbnkctl kubectl`, which targets the ADOPTED cluster via the workspace
        # kubeconfig on the shared PVC (downloaded by the kubeconfig-fetch step). No
        # second `ibmcloud login` and no second credential path.
        - name: cwc-guard
          image: PLACEHOLDER_RUNNER_IMAGE
          command: [sh, -ec]
          args:
            - |
              [ "${CWC_GUARD_ENABLED:-true}" = "true" ] || { echo "cwc guard disabled"; exit 0; }
              # CWC lives in the SHARED-components namespace, which is f5-utils by default
              # but equals the BNK namespace on a ONE-namespace install (#66). Follow
              # ROKSBNKCTL_FLO_UTILS_NAMESPACE when it is set, or this guard watches a
              # namespace that does not exist and silently never patches — and the
              # Multi-Attach deadlock it exists to break just hangs bnk up instead.
              NS="${CWC_NAMESPACE:-${ROKSBNKCTL_FLO_UTILS_NAMESPACE:-f5-utils}}"; DEP="${CWC_DEPLOYMENT:-f5-spk-cwc}"
              K="roksbnkctl -w bnkconn kubectl"
              patched=0
              # ~27 min, comfortably covering bnk up's 15m license gate.
              for _ in $(seq 1 160); do
                if $K -n "$NS" get deploy "$DEP" >/dev/null 2>&1; then
                  if [ "$patched" = 0 ]; then
                    $K -n "$NS" patch deploy "$DEP" --type=merge \
                      -p '{"spec":{"strategy":{"type":"Recreate","rollingUpdate":null}}}' >/dev/null 2>&1 \
                      && { patched=1; echo "cwc: strategy=Recreate applied"; }
                  fi
                  # A live deadlock shows as >1 cwc pod with one stuck ContainerCreating.
                  # Patching strategy does NOT release an already-attached volume, so
                  # cycle to 0 and back to free it.
                  pods="$($K -n "$NS" get pods 2>/dev/null | grep "$DEP" || true)"
                  if [ "$(echo "$pods" | grep -c "$DEP")" -gt 1 ] && echo "$pods" | grep -q ContainerCreating; then
                    echo "cwc: Multi-Attach deadlock — cycling replicas to release the RWO volume"
                    $K -n "$NS" scale deploy "$DEP" --replicas=0 >/dev/null 2>&1
                    for _ in $(seq 1 20); do
                      [ "$($K -n "$NS" get pods 2>/dev/null | grep -c "$DEP")" = 0 ] && break
                      sleep 6
                    done
                    $K -n "$NS" scale deploy "$DEP" --replicas=1 >/dev/null 2>&1
                  fi
                  if [ "$($K -n "$NS" get licenses.k8s.f5net.com bnk-license -o jsonpath='{.status.state}' 2>/dev/null)" = "Active" ]; then
                    echo "cwc: licence Active — guard done"; exit 0
                  fi
                fi
                sleep 10
              done
              exit 0
          workingDir: /work
          envFrom:
            - configMapRef: { name: bnk-env }
            - secretRef:    { name: bnk-secrets }
          env:
            - { name: CWC_GUARD_ENABLED, value: "{{workflow.parameters.cwc-guard}}" }
            - { name: ROKSBNKCTL_HOME,   value: "/work/.roksbnkctl" }
            - { name: HOME,              value: "/home/runner" }
          volumeMounts:
            - { name: work, mountPath: /work }
