# cluster.yaml — AI rig: BNK load-balancer + GPU inference nodegroup (PRD-11 slice 1)
#
# Deploys two nodegroups:
#   - NodeGroups[0] (bnk): the BNK TMM control nodegroup (3×m6i.4xlarge, on-demand,
#       pinned to the data-path AZ). Role=bnk is injected automatically by defaults.
#   - NodeGroups[1] (gpu): NVIDIA GPU inference nodegroup (1×g5.2xlarge, spot,
#       pinned to ap-southeast-2a + ap-southeast-2c). g5 is NOT available in 2b
#       — awsbnkctl validate will reject a 2b AZ entry with a clear error.
#
# The GPU nodegroup is tainted nvidia.com/gpu=present:NoSchedule so only workloads
# that tolerate the taint (e.g. vLLM, slice 2) land on it. Phase 11c installs the
# NVIDIA k8s-device-plugin DaemonSet (v0.17.1), which advertises nvidia.com/gpu
# once the g5 node is ACTIVE.
#
# Spot reclaim note: g5 spot in ap-southeast-2 is generally stable; a reclaim drops
# the node, the ASG re-launches in 2a or 2c, the device-plugin lands via nodeSelector,
# and a vLLM pod reschedules after nvidia.com/gpu re-advertises (cold model reload,
# ~minutes). Use capacityType: on-demand for guaranteed availability.
#
# Quick start:
#   awsbnkctl validate examples/ai-rig/cluster.yaml
#   awsbnkctl up --config examples/ai-rig/cluster.yaml --dry-run
#   awsbnkctl up --config examples/ai-rig/cluster.yaml

apiVersion: awsbnkctl/v1
kind: Cluster

metadata:
  name: ai-rig
  region: ap-southeast-2
  labels:
    purpose: bnk-ai-inference

# external-only: BNK TMM gets one external (ingress) interface; GPU inference
# pods reach the backend over the CNI. The BNK VIP is the slice-2 entry point.
pattern: external-only

network:
  vpcCidr: 10.0.0.0/16

  # g5 instances are available in ap-southeast-2a and ap-southeast-2c only.
  # Do NOT add ap-southeast-2b — g5 capacity is absent there.
  azs:
    - ap-southeast-2a
    - ap-southeast-2c

  subnets:
    public:
      - cidr: 10.0.1.0/24
        az: ap-southeast-2a
      - cidr: 10.0.3.0/24
        az: ap-southeast-2c
    private:
      - cidr: 10.0.11.0/24
        az: ap-southeast-2a
      - cidr: 10.0.13.0/24
        az: ap-southeast-2c

  dataPath:
    external:
      cidr: 10.0.10.0/24    # BNK_EXT — TMM ingress / client-side VLAN
      az: ap-southeast-2a

  natGateways: 1

cluster:
  kubernetesVersion: "1.30"
  nodeGroups:
    # Index 0: BNK TMM control nodegroup. role=bnk injected automatically.
    # Three nodes for dSSM quorum (required by all BNK patterns).
    - name: bnk
      instanceType: m6i.4xlarge
      desiredSize: 3
      minSize: 3
      maxSize: 4
      diskSize: 50

    # Index 1: GPU inference nodegroup. gpu: true → NVIDIA AMI + no BNK LT.
    # g5.xlarge: 1×NVIDIA A10G GPU (SAME 24GB A10G as g5.2xlarge — preserves the
    # apples-to-apples A10G benchmark vs SageMaker ml.g5.2xlarge), 4 vCPU, 16 GB
    # RAM. Chosen 2026-06-12 because g5.2xlarge hit InsufficientInstanceCapacity
    # in BOTH ap-southeast-2a and 2c (capacity flipped between AZs ~every 20 min);
    # g5.xlarge has the same GPU with better availability + lower cost (~$0.60/hr).
    # capacityType: on-demand for guaranteed availability under capacity pressure.
    - name: gpu
      gpu: true
      instanceType: g5.xlarge
      capacityType: on-demand
      desiredSize: 1
      minSize: 1
      maxSize: 2
      diskSize: 100
      # Span both g5 AZs (2b has no g5 at all) so the ASG can take capacity in
      # whichever AZ has it. Capacity in ap-southeast-2 was volatile on 2026-06-12.
      azs:
        - ap-southeast-2a
        - ap-southeast-2c
      # Taint keeps non-GPU workloads off this nodegroup. vLLM pods (slice 2)
      # must tolerate nvidia.com/gpu=present:NoSchedule to schedule here.
      taints:
        - key: nvidia.com/gpu
          value: "present"
          effect: NoSchedule

# ai: provisions the disposable SageMaker LMI (vLLM) endpoint for the managed
# inference leg. On `up`, three AWS resources are created in order:
#   SageMaker Model → EndpointConfig → Endpoint.
# On `down`, they are deleted in reverse order so nothing bills between sessions.
# Requires HF_TOKEN env var at up time for gated models (never hardcode the token).
ai:
  sagemaker:
    enabled: true
    model: meta-llama/Meta-Llama-3-8B-Instruct
    # ml.g5.xlarge: same single A10G as the in-cluster g5.xlarge leg (apples-to-apples)
    # and the type with SageMaker endpoint capacity + quota in ap-southeast-2 —
    # ml.g5.2xlarge hit InsufficientInstanceCapacity for SageMaker on 2026-06-13.
    instanceType: ml.g5.xlarge
    scaleToZero: false

# bnk: F5 supply-chain credentials, required by Phase 12. Replace both paths
# with your own files before running `up` (gitignored).
bnk:
  farArchive: ./cne_pull_64.json     # REPLACE with your F5 FAR pull credentials JSON
  jwt: ./license.jwt                 # REPLACE with your F5 subscription JWT

# testing: provisions the multi-ENI jumphost so forge-orchestrated aiperf
# benchmarks have an in-network client. The jumphost (c6i.2xlarge, AL2023) sits
# in the first public subnet (10.0.1.0/24) for EICE management access, but
# also gets a secondary ENI placed directly in the BNK_EXT data-path VLAN
# (10.0.10.0/24). The curl probe uses `--interface <BNK_EXT_ENI_IP>` so
# benchmark traffic enters TMM on the real data path (not via NAT/management).
# This is how all existing demo scenarios reach the BNK VIP (10.0.10.100).
testing:
  jumphost:
    enabled: true   # in-network aiperf client for forge benchmarks (reaches BNK VIP on external VLAN)
    # c6i.2xlarge (8 vCPU, non-burstable): credible-load generator for the
    # baseline scenario sweep (concurrency 50-200). t3.small is burstable
    # (CPU-credit throttling → non-reproducible numbers) and too small — the
    # load generator would become the bottleneck. Also retires the
    # ensure-aiperf OOM/throttle during pip install.
    instanceType: c6i.2xlarge

tags:
  env: dev
  purpose: ai-inference-rig
