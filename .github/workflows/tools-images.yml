name: Build tools images

# Builds and publishes the per-tool docker images that PRD 03's docker
# backend pulls at runtime:
#
#   - ghcr.io/jgruberf5/roksbnkctl-tools-ibmcloud
#   - ghcr.io/jgruberf5/roksbnkctl-tools-iperf3
#   - ghcr.io/jgruberf5/roksbnkctl-tools-h2load
#   - ghcr.io/jgruberf5/roksbnkctl-tools-runner   (the all-in-one runner; PRD 15)
#   - ghcr.io/jgruberf5/roksbnkctl-tools-mdbook
#
# Triggered on tag pushes (e.g. v0.9-rc1), on push to `main` (publishes a
# `:dev` tag so `go install ./cmd/roksbnkctl@main` works on a fresh host
# without a local `tools/docker/Makefile build` step), and on manual
# dispatch — never on every PR.
#
# Sprint 4 staff Issue 2 + Sprint 5 validator scope (validator owns
# CI workflow files). Tag → `:<tagname>` + `:latest`. Main-push →
# `:dev`. Workflow dispatch → both `:dev` and the input ref name.

on:
  push:
    tags: ['v*']
    branches: [main, 'bnk-*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [ibmcloud, iperf3, h2load, runner, mdbook]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag-push: publish :<tagname> + :latest. The first matrix job
      # also publishes :latest; the workflow doesn't dedupe across
      # matrix runs because each tools-* image has its own :latest.
      #
      # Context is the REPO ROOT (not tools/docker/<image>/) because
      # the ibmcloud image's Stage 1 Go build needs ./cmd, ./internal,
      # go.mod/go.sum, embedded.go, and ./terraform/. Every Dockerfile's
      # local COPYs are therefore root-relative (e.g. the mdbook image
      # COPYs tools/docker/mdbook/{puppeteer-config.json,render-mermaid.lua}).
      # The build-args below are ibmcloud-specific and harmlessly ignored
      # by the others.
      # `:latest` must follow ONE line, or it silently moves consumers between
      # BNK product lines. A tag cut on bnk-2-3 publishing `:latest` would
      # repoint every 2.4 pipeline at 2.3 orchestration, and vice versa —
      # including scripts/tf-variable-validation-test.sh, whose TF_TEST_IMAGE
      # defaults to it.
      #
      # The rule: `:latest` tracks the TRUNK. A tag whose commit is reachable
      # from origin/main moves it; a tag cut on a release branch publishes its
      # own `:<tag>` and nothing else. Release lines are addressed by explicit
      # tag or by their `:<branch>-dev` (below).
      - name: Decide whether this tag moves :latest
        if: startsWith(github.ref, 'refs/tags/v')
        id: latest
        run: |
          git fetch --no-tags --depth=100 origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "move=true" >> "$GITHUB_OUTPUT"
            echo "tag $GITHUB_REF_NAME is on the trunk — it will move :latest"
          else
            echo "move=false" >> "$GITHUB_OUTPUT"
            echo "tag $GITHUB_REF_NAME is on a release line — :latest stays where it is"
          fi

      - name: Build and push (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./tools/docker/${{ matrix.image }}/Dockerfile
          build-args: |
            ROKSBNKCTL_VERSION=${{ github.ref_name }}
            ROKSBNKCTL_COMMIT=${{ github.sha }}
          push: true
          tags: |
            ghcr.io/jgruberf5/roksbnkctl-tools-${{ matrix.image }}:${{ github.ref_name }}
            ${{ steps.latest.outputs.move == 'true' && format('ghcr.io/jgruberf5/roksbnkctl-tools-{0}:latest', matrix.image) || '' }}

      # Main-push: publish :dev. internal/exec/docker.go's toolImageTag()
      # falls back to ":dev" for binaries that report Version=="dev"
      # (i.e., a `go install ./cmd/roksbnkctl@main` build); having :dev
      # in GHCR closes the gap so the docker backend doesn't fail to
      # pull on a fresh dev box.
      # A release branch needs a moving tag too, or the only way to test its
      # tip is to cut a release. It must NOT be `:dev` — that is the trunk's,
      # and toolImageTag() resolves a Version=="dev" binary to it. So bnk-2-3
      # publishes `:bnk-2-3-dev`.
      - name: Build and push (branch → :dev / :<branch>-dev)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./tools/docker/${{ matrix.image }}/Dockerfile
          build-args: |
            ROKSBNKCTL_VERSION=dev
            ROKSBNKCTL_COMMIT=${{ github.sha }}
          push: true
          tags: |
            ghcr.io/jgruberf5/roksbnkctl-tools-${{ matrix.image }}:${{ github.ref_name == 'main' && 'dev' || format('{0}-dev', github.ref_name) }}

      # workflow_dispatch: build + push both forms so a manual run from
      # any branch can publish a :dev tag for testing.
      - name: Build and push (workflow_dispatch → :dev)
        if: github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./tools/docker/${{ matrix.image }}/Dockerfile
          build-args: |
            ROKSBNKCTL_VERSION=dev
            ROKSBNKCTL_COMMIT=${{ github.sha }}
          push: true
          tags: |
            ghcr.io/jgruberf5/roksbnkctl-tools-${{ matrix.image }}:dev
