name: Release

# Triggers on tag push (vX.Y.Z). goreleaser creates the GitHub Release,
# builds linux/darwin/windows × amd64/arm64 binaries, generates the
# checksums.txt asset, and attaches everything.
#
# This is what makes `roksbnkctl self update` actually work — the asset
# names goreleaser produces match what self.go expects.
#
# To cut a release:
#
#   git tag v0.1.0
#   git push origin v0.1.0
#
# The workflow_dispatch path is a manual fallback for re-running the
# build against an existing tag (e.g. if the first attempt failed mid-way).

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to re-build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write # required to upload release assets

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # goreleaser needs full history for the changelog generator.
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v7
        with:
          # Build releases with the latest stable Go, not just the go.mod
          # minimum (1.25.0), so the binaries ship current Go-stdlib security
          # fixes (govulncheck flagged go1.26.3 stdlib advisories — fixed in
          # the toolchain, not a module bump). Matches the security.yml scan.
          go-version: stable
          cache: true

      # Which release line this tag belongs to.
      #
      # roksbnkctl's version is deliberately NOT tied to the BNK version: main
      # and every bnk-<major>-<minor> branch share ONE rising semver sequence,
      # so v1.43.0 and v1.44.0 can belong to different product lines and the
      # number cannot express which. goreleaser stamps this into the binary and
      # into the release notes so `self update` can keep an operator on their
      # own line instead of silently moving them across.
      #
      # Same ancestor test the container :latest gate uses, for one answer.
      - name: Resolve the release line
        id: line
        run: |
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          line=""
          if git merge-base --is-ancestor HEAD origin/main 2>/dev/null; then
            line=main
          else
            # Newest bnk-* branch containing this commit. A tag normally sits on
            # exactly one; if it somehow sits on several, the earliest line is
            # the conservative answer — it is the one with the older BNK.
            line="$(git branch -r --contains HEAD --format='%(refname:short)' \
                    | sed -n 's#^origin/\(bnk-[0-9][0-9-]*\)$#\1#p' | sort | head -1)"
          fi
          if [ -z "$line" ]; then
            echo "::error::tag $GITHUB_REF_NAME is not reachable from main or any bnk-* branch;" \
                 "goreleaser would stamp an empty release line. Push the tag on a release branch." >&2
            exit 1
          fi
          echo "release line: $line"
          echo "line=$line" >> "$GITHUB_OUTPUT"

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROKSBNKCTL_RELEASE_LINE: ${{ steps.line.outputs.line }}
