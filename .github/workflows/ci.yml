name: CI

# Runs on every PR and on push to main/staging. staging is the always-on
# integration/build branch (PRs target staging; staging promotes to main
# weekly). Catches the SDK-method-name and version-pin guesses captured in
# docs/SHAKEOUT.md without needing anyone to drive a local build.

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  test:
    name: vet + fmt + staticcheck + test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Track go.mod's `go` directive — testcontainers-go's
          # transitive otel deps require Go 1.25+, and pinning here
          # would diverge silently from go.mod. setup-go reads the
          # directive and downloads a matching toolchain.
          go-version-file: go.mod
          cache: true

      - name: Resolve modules
        run: |
          go mod download
          go mod verify

      - name: go vet
        run: go vet ./...

      - name: gofmt
        # Fail if any file is not gofmt-clean. `tee` keeps the diff in the
        # log so reviewers can see exactly what's wrong.
        run: gofmt -d -l . | tee /tmp/gofmt.diff && test ! -s /tmp/gofmt.diff

      - name: staticcheck
        # Pinned via go.mod `tool` directive (Sprint-0, 2026-05-25) — the
        # version travels with the source tree, so `make lint` locally and
        # this CI step run the exact same binary. No more snowflake-pin
        # drift between local and CI.
        run: go tool staticcheck ./...

      - name: go test
        # -race catches data races; cheap to run on the small unit suite
        # we have today. Sprint 2 added `internal/k8s/*_test.go` —
        # they're picked up here automatically once the integrator drops
        # the `k8sinternal` build tag (carried temporarily during staff
        # +validator parallel work). See `internal/k8s/get_test.go`
        # header for the rationale and removal plan.
        run: go test -race ./...

      - name: go build
        # Build everything (cmd/ + internal/) to catch any unused-import
        # or undefined-symbol issues that vet/test missed.
        run: go build ./...

  integration:
    name: integration (testcontainers — sshd)
    needs: test
    # Linux only: testcontainers-go on macOS GitHub runners requires Docker
    # Desktop, which isn't installed on the hosted images. Windows runners
    # have similar Docker-availability gaps. Linux runners ship Docker by
    # default, so we get a free integration tier on every push to main and
    # on same-repo PRs.
    #
    # Skipped on PRs from forks: the `head.repo.full_name == repository`
    # check below excludes those. Forks would otherwise hit Docker rate
    # limits without the right secrets and produce noisy red-x checks for
    # contributions that don't even touch internal/remote.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      # Disable the testcontainers-go `testcontainers/ryuk` reaper. On
      # ephemeral GitHub-hosted runners the runner VM is discarded after
      # the job, so leaked containers can't survive — the reaper's only
      # job is to clean up against long-lived hosts. Disabling it kills
      # the docker-hub `testcontainers/ryuk:<v>` image pull that produced
      # the intermittent `429 too many requests` flake on
      # `TestIntegration_Connect_Whoami` during the v1.1.x cycle.
      # PLAN.md §"Sprint 9" code deliverable 4.
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Track go.mod's `go` directive rather than hard-coding here —
          # the testcontainers-go dependency chain (docker → otel) pulls
          # in a recent toolchain requirement; pinning a stale version
          # in this YAML would diverge silently.
          go-version-file: go.mod
          cache: true

      - name: go test (integration tag)
        # 5m wall budget covers image pull (~30s on a cold runner) +
        # six test cases × ~20s each. Bumps if we add tests; reduce
        # only after measuring.
        run: go test -tags integration -timeout 5m ./internal/remote/...

  docker-backend:
    name: integration (docker backend)
    needs: test
    # Linux-only mirror of the existing integration job, scoped to the
    # docker backend tests under `internal/exec/`. Sprint 3 / PRD 03
    # introduces `internal/exec/docker_integration_test.go` which spins
    # short-lived busybox containers via the docker backend and asserts
    # the cred-no-leak invariant from PRD 04. Skipped on PRs from forks
    # for the same reasons as the `integration` job above.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Pre-pull test images
        # The integration tests use busybox:1.36 (bind-mount round-trip
        # probe) — pre-pull on the host docker daemon so the first run
        # inside Go's 90s context budget doesn't time out on a cold
        # Docker Hub pull.
        run: docker pull busybox:1.36

      - name: go test (integration tag — exec/docker)
        # The tests inside this package self-skip when `docker info`
        # fails, so the job is safe even on a runner without a daemon.
        # 5m matches the existing integration job's budget.
        run: go test -tags integration -timeout 5m ./internal/exec/...

  aws-mocked:
    name: integration (aws — mocked sdk)
    needs: test
    # Sprint 1 (PRD 07): exercises `internal/aws/{client,sts,ec2,eks,vpc}.go`
    # against mocked aws-sdk-go-v2 clients. Sprint 2 (PRD 08) extends
    # the same job to cover `internal/aws/{s3,iam}.go` — the S3 supply
    # chain helpers (`PutObject`, `HeadObject`) and the IRSA / OIDC
    # readers (`GetOIDCProvider`, `HasIRSARole`) — using the same
    # aws-sdk-go-v2 middleware-test pattern. NO LIVE AWS — the staff
    # agent injects fake API responders via the middleware seam (or
    # hand-rolled interfaces in test files). This job runs on every PR
    # and push because it doesn't need credentials, network egress to
    # AWS, or a runtime daemon; the only requirement is the Go toolchain.
    #
    # Live-AWS validation is the operator-run spike (PRD 07 §"Spike
    # protocol"), gating v0.2 outside the agent dispatch lane.
    #
    # If a future test calls `sts.GetCallerIdentity` / `s3.PutObject` /
    # `iam.GetOpenIDConnectProvider` (or any other AWS API) without a
    # mock, this job will time out hitting the real AWS endpoint with
    # no creds. The validator's task brief calls for an issue against
    # the staff agent in that scenario rather than a silent fix here.
    #
    # Sprint 2 deferral (validator Issue 2): a localstack-backed
    # integration tier (`services: localstack:` step) is the v1.x
    # follow-up — gives the S3 + IAM helpers a real HTTP endpoint to
    # round-trip against without needing a real AWS account. For v1.0
    # the mocked-only path keeps the CI surface free of Docker-in-CI
    # cost + flake, and the PRD 08 helpers are simple enough that
    # mocked unit tests catch the regression shape.
    runs-on: ubuntu-latest
    env:
      # Belt-and-braces: if a test path leaks past its mock, these
      # fake creds let the SDK construct a Signer without panicking on
      # an empty default-chain resolve, while still failing closed at
      # the network layer (the fake key would 403 a real AWS endpoint).
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_SESSION_TOKEN: testing
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go test (integration tag — internal/aws)
        # 3m budget covers the mocked-SDK suite — no image pulls, no
        # network. Sprint 2 (PRD 08) adds `internal/aws/{s3,iam}_test.go`
        # to the same package, so the wildcard `./internal/aws/...`
        # already picks them up — no per-file invocation needed.
        # Bumps if the suite grows; reduce only after measuring.
        run: go test -tags integration -timeout 3m ./internal/aws/...

  k8s-backend:
    name: integration (k8s backend — kind)
    needs: test
    # Linux-only kind-based integration job for the K8s backend (Sprint 4
    # / PRD 03 second half). Uses helm/kind-action to spin an ephemeral
    # kind cluster, then runs the integration-tagged tests under
    # internal/exec and internal/cli (the latter exercises `awsbnkctl
    # ops install/show/uninstall` end-to-end).
    #
    # Skipped on PRs from forks for the same reasons as the `integration`
    # job above — kind images pulled from upstream registries hit rate
    # limits without GHCR credentials.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: helm/kind-action@v1
        with:
          wait: 120s
          version: v0.24.0

      - name: Pre-load test images into kind
        # Pull busybox:1.36 on the host docker daemon, then `kind load`
        # it into the kind node so kubelet doesn't have to pull from
        # Docker Hub (rate-limited on cold runners, often times out
        # against the 3m k8sJobReadyTimeout in internal/exec/k8s.go).
        # The same pull also serves the docker-backend integration
        # test that runs alongside in this job (busybox bind-mount
        # round-trip).
        run: |
          docker pull busybox:1.36
          kind load docker-image busybox:1.36 --name chart-testing

      - name: go test (integration tag — exec/k8s + cli/ops)
        # Tests self-skip when no kubeconfig is reachable, so a kind
        # bring-up failure surfaces as a yellow-skip rather than a red
        # fail (still investigable from the kind-action logs above).
        # 10m budget covers image pulls + ops-pod scheduling + the
        # full ops install/show/uninstall lifecycle.
        run: go test -tags integration -timeout 10m ./internal/exec/... ./internal/cli/...

  full-up-dryrun:
    name: full-up-dryrun (awsbnkctl up --dry-run)
    needs: test
    # Sprint 3 (PLAN.md § "Sprint 3"): the first end-to-end gate that
    # asserts `awsbnkctl up --dry-run` plans the full module graph —
    # eks_cluster → cert_manager → s3_supply_chain + iam_irsa →
    # flo → cne_instance → license → testing — without panicking. No
    # live AWS: fake creds + AWS_EC2_METADATA_DISABLED match the
    # `aws-mocked` job. terraform plan reaches the AWS endpoints only
    # for data sources the modules read; with fake creds those calls
    # 403 and Terraform surfaces them as plan-time diagnostics, which
    # is what we want — the assertion is "the orchestrator dispatched
    # plan against every module", not "AWS accepted the plan".
    #
    # SPIKE DEFERRAL still in force (PRD 07 §"Spike protocol"): live
    # `terraform apply` lands the v0.2 tag, gated outside this lane.
    # This job exercises the plan path only.
    #
    # If staff has not yet wired the top-level `--dry-run` flag on the
    # `up` command at the time this job first runs, it will fail with
    # `unknown flag: --dry-run` — that is the intended canary. The
    # job exists as a sprint-close regression gate; once staff's
    # `lifecycle.go runUp` plumbs --dry-run through to the root
    # terraform module, this job goes green.
    runs-on: ubuntu-latest
    env:
      # Mirror of aws-mocked job: fake creds let the SDK signer
      # construct without panicking on an empty default chain. The
      # AWS calls Terraform makes (e.g. data.aws_caller_identity) will
      # 403, but the plan still emits a graph that names every module
      # — which is what the grep assertion checks.
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_SESSION_TOKEN: testing
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: hashicorp/setup-terraform@v3
        with:
          # Pin to a stable 1.x line; the modules require >= 1.0
          # per terraform/main.tf. Newer minor versions are fine.
          terraform_version: "~1.9"
          terraform_wrapper: false

      - name: Build awsbnkctl
        # Emit the binary at bin/awsbnkctl to match the path the brief
        # exercises (./bin/awsbnkctl). Same layout the integrator's
        # tag-time goreleaser job uses.
        run: |
          mkdir -p bin
          go build -o bin/awsbnkctl ./cmd/awsbnkctl

      - name: Run up --dry-run and capture plan output
        # Use a fresh HOME so the workspace config-yaml path is
        # isolated from any state the test runner inherited. Sprint 4
        # (commit 727b2bb in cluster.go:runFullLifecyclePlan) tightened
        # the gate — `up --dry-run` now requires a workspace yaml on
        # disk OR --var-file. Seed a stub workspace with placeholder
        # VPC + subnet + supply-chain paths; terraform plan will walk
        # every module (which the next step asserts) before AWS
        # rejects the fake creds.
        run: |
          set -eo pipefail
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME/.awsbnkctl/default/state"
          mkdir -p artifacts

          : > "$HOME/.awsbnkctl/default/far.tgz"
          : > "$HOME/.awsbnkctl/default/license.jwt"

          cat > "$HOME/.awsbnkctl/default/config.yaml" <<YAML
          aws:
            region: us-east-1
            vpc_id: vpc-00000000000000000
            subnet_ids:
              - subnet-00000000000000001
              - subnet-00000000000000002
              - subnet-00000000000000003
            supply_chain:
              far_archive_path: $HOME/.awsbnkctl/default/far.tgz
              jwt_path: $HOME/.awsbnkctl/default/license.jwt
          cluster:
            create: true
            name: ci-canary
          tf_source:
            type: local
            path: ./terraform
          YAML

          cat > "$HOME/.awsbnkctl/config.yaml" <<'YAML'
          current_workspace: default
          YAML

          # Drop a terraform *_override.tf next to providers.tf that
          # turns off the AWS provider's STS / IMDS / account-ID
          # validation. Without these flags, the provider calls
          # sts:GetCallerIdentity at plan time, AWS-403s on the fake
          # creds, and terraform aborts before expanding the
          # AWS-dependent modules — which is exactly what the next
          # step asserts on. The override is CI-only: real operators
          # always have valid creds and don't need this.
          cat > terraform/_ci_override.tf <<'TF'
          provider "aws" {
            skip_credentials_validation = true
            skip_requesting_account_id  = true
            skip_metadata_api_check     = true
          }
          TF

          # `|| true` lets terraform's expected non-AWS errors (e.g.
          # data sources that depend on real cluster state) land in
          # the log without failing the step. The grep assertions in
          # the next step are the actual gate.
          ./bin/awsbnkctl up --dry-run 2>&1 | tee artifacts/up-dryrun.log || true

      - name: Assert plan output mentions all 7 modules
        # Module list per Sprint 3 brief: eks_cluster, cert_manager,
        # s3_supply_chain, iam_irsa, flo, cne_instance, license,
        # testing. (Brief writes "7 modules" but lists 8 names; we
        # assert every name in the list — see
        # issues/issue_sprint3_validator.md Issue 1 for the audit
        # trail.) Each match is a separate grep so a missing module
        # surfaces by name in the failed-step output, not as a single
        # opaque "no match" line.
        run: |
          set -eo pipefail
          log=artifacts/up-dryrun.log
          fail=0
          for mod in \
            eks_cluster \
            cert_manager \
            s3_supply_chain \
            iam_irsa \
            flo \
            cne_instance \
            license \
            testing
          do
            # Match either:
            #  - the plan-time form `module.${mod}.something` (post-init,
            #    when terraform expands the resource graph)
            #  - the init-time form `- ${mod} in modules/...` (which
            #    terraform always prints, even when plan errors at a
            #    later data source — this is the case under fake creds:
            #    the plan walks far enough to list every module via init
            #    but bails before fully expanding each one)
            if ! grep -qE "(module\.${mod}\b|\"${mod}\"|- ${mod} in modules/)" "$log"; then
              echo "::error::module not found in plan output: ${mod}"
              fail=1
            else
              echo "  ✓ ${mod}"
            fi
          done
          exit "$fail"

      - name: Upload plan output
        # Always upload — green or red — so debug context survives.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: up-dryrun-log
          path: artifacts/up-dryrun.log
          if-no-files-found: warn

  test-dryrun:
    name: test-dryrun (awsbnkctl test {connectivity,dns,throughput} --dry-run)
    needs: test
    # Sprint 4 (PLAN.md § "Sprint 4"): the test-surface refresh gate
    # that asserts `awsbnkctl test {connectivity,dns,throughput}
    # --dry-run` resolves a workspace config and emits a sensible
    # "would probe X" plan against fake hosts without panicking and
    # without making real network calls. No live network egress — a
    # fake workspace is materialised under $HOME/.awsbnkctl with
    # entries pointing at non-resolving names; the dry-run path is
    # expected to enumerate the would-be probes and exit-0.
    #
    # SPIKE DEFERRAL still in force (PRD 07 § "Spike protocol"): this
    # job is the offline regression surface for the test verbs; the
    # live-AWS exercise of the same surface happens in the operator-
    # run spike, gating v0.2 outside the agent dispatch lane.
    #
    # Canary posture (same shape as Sprint 3's full-up-dryrun gate):
    # if staff has not yet wired `--dry-run` onto the test
    # subcommands at the time this job first runs, every step will
    # fail with `unknown flag: --dry-run` and the job goes red. That
    # is the **intended** signal; it flips green when staff lands the
    # flag per the Sprint 4 staff brief
    # ("plumb workspace region + cluster outputs into test commands;
    # add --dry-run to the test verbs").
    #
    # See issues/issue_sprint4_validator.md Issue 1 for the audit
    # trail and the proposed surface contract this job asserts.
    runs-on: ubuntu-latest
    env:
      # Mirror of aws-mocked / full-up-dryrun: fake creds so any
      # SDK signer construction succeeds; AWS calls (if any leak past
      # the dry-run gate) will 403 rather than time out.
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_SESSION_TOKEN: testing
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build awsbnkctl
        # Same path the Sprint 3 full-up-dryrun job uses
        # (./bin/awsbnkctl), matching what the brief's command lines
        # exercise verbatim.
        run: |
          mkdir -p bin
          go build -o bin/awsbnkctl ./cmd/awsbnkctl

      - name: Materialise fake workspace
        # Build a minimal workspace config the test verbs can load
        # without needing a real AWS context. The DNS + connectivity
        # suites read `test.connectivity.extra_hosts` and
        # `test.dns.default_target`; throughput reads
        # `test.throughput.{image,duration,streams}` plus the
        # cluster.name workspace field. A fresh HOME isolates the run
        # from any local awsbnkctl state on the runner.
        #
        # Schema reference: `internal/config/workspace.go::Workspace`
        # uses a top-level `cluster:` block (Name/Create) and an
        # `aws:` block (Region/Profile). The on-disk layout is
        # `~/.awsbnkctl/<workspace>/config.yaml` (per-workspace) and
        # `~/.awsbnkctl/config.yaml` (global, with
        # `current_workspace:` pointer). We pass -w ci-dryrun on the
        # command line so the test verbs pick up the workspace
        # directly — no global-config materialisation needed.
        run: |
          set -eo pipefail
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME/.awsbnkctl/ci-dryrun"
          cat > "$HOME/.awsbnkctl/ci-dryrun/config.yaml" <<'YAML'
          cluster:
            create: false
            name: ci-dryrun-cluster
          aws:
            region: us-east-1
          tf_source:
            type: github
            repo: JLCode-tech/awsbnkctl-tf
            ref: main
          test:
            connectivity:
              extra_hosts:
                - https://dry-run.example.invalid/health
                - https://gslb.dry-run.example.invalid/
            dns:
              default_target: dry-run.example.invalid
            throughput:
              duration: 5
              streams: 1
          YAML

      - name: awsbnkctl test connectivity --dry-run
        # Asserts (a) exit-0, (b) the would-probe planning output names
        # the configured hosts. The dry-run path must NOT make real
        # HTTP calls — the .invalid TLD guarantees a network resolution
        # failure if the dry-run gate leaks past plan-only mode.
        run: |
          set -eo pipefail
          export HOME="$RUNNER_TEMP/home"
          mkdir -p artifacts
          ./bin/awsbnkctl -w ci-dryrun test connectivity --dry-run \
            2>&1 | tee artifacts/test-connectivity-dryrun.log
          grep -qiE 'would probe|would check|dry[- ]run|plan' \
            artifacts/test-connectivity-dryrun.log
          grep -q 'dry-run.example.invalid' \
            artifacts/test-connectivity-dryrun.log

      - name: awsbnkctl test dns --dry-run
        # Asserts the DNS suite enumerates the configured target
        # (default_target) and resolver vantages without sending
        # an actual query.
        run: |
          set -eo pipefail
          export HOME="$RUNNER_TEMP/home"
          ./bin/awsbnkctl -w ci-dryrun test dns --dry-run \
            2>&1 | tee artifacts/test-dns-dryrun.log
          grep -qiE 'would probe|would query|dry[- ]run|plan' \
            artifacts/test-dns-dryrun.log
          grep -q 'dry-run.example.invalid' \
            artifacts/test-dns-dryrun.log

      - name: awsbnkctl test throughput --dry-run
        # Asserts the iperf3 suite enumerates the would-deploy
        # fixture (namespace + image + mode) without actually
        # creating the in-cluster Pod or contacting the k8s
        # API. The "would deploy" planning text is the visible
        # marker.
        run: |
          set -eo pipefail
          export HOME="$RUNNER_TEMP/home"
          ./bin/awsbnkctl -w ci-dryrun test throughput --dry-run \
            2>&1 | tee artifacts/test-throughput-dryrun.log
          grep -qiE 'would deploy|would probe|dry[- ]run|plan' \
            artifacts/test-throughput-dryrun.log
          grep -qiE 'iperf3|throughput' \
            artifacts/test-throughput-dryrun.log

      - name: Upload dry-run logs
        # Always upload so a red run leaves debug context behind.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-dryrun-logs
          path: artifacts/
          if-no-files-found: warn

  windows-build:
    name: windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go build ./...

  goreleaser-check:
    name: goreleaser config sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          # `check` validates .goreleaser.yml without producing artefacts.
          # Catches typos and template breaks before tag time.
          args: check

  book-build:
    name: book build + cspell
    # Sprint 5 (PLAN.md § "Sprint 5" — book retarget): every PR runs
    # `mdbook build book/` plus cspell over `book/src/**/*.md` so a
    # broken chapter or unknown-word regression surfaces at PR-review
    # time, not at integrator-tag time. The existing book.yml workflow
    # only runs on `book/**` path changes; this job runs on every PR
    # so a cspell.json edit (or a workflow YAML edit) also gets
    # validated against the chapter set without needing a chapter edit
    # to trigger book.yml.
    #
    # PDF rendering stays out of CI — the multi-GB pandoc + XeLaTeX +
    # mermaid-cli toolchain is the integrator's local-driven
    # responsibility (see `make release` / `make release-publish` in
    # the Makefile). HTML build catches every chapter-shape regression
    # (broken markdown, dead anchor, malformed code fence) that
    # affects the published web book at
    # https://JLCode-tech.github.io/awsbnkctl/book/.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 'latest'

      - name: Install mdbook-mermaid
        # mdbook-mermaid is a separate preprocessor binary; the
        # peaceiris/actions-mdbook action only ships mdbook itself.
        # Cached across runs by baptiste0928/cargo-install.
        uses: baptiste0928/cargo-install@v3
        with:
          crate: mdbook-mermaid

      - name: mdbook build (HTML)
        # Pandoc backend is `optional = true` in book/book.toml, so
        # this builds HTML cleanly without needing pandoc/XeLaTeX on
        # the runner. Fails the job on broken markdown, dead links,
        # malformed code fences.
        run: mdbook build book/

      - name: cspell (book/src/**/*.md + docs/**/*.md)
        # Hard-fail on any unknown-word finding. Sprint 5 validator
        # closed the cspell.json vocabulary to zero findings against
        # the rewritten chapter set; Sprint 6 validator extends the
        # gate to `docs/**/*.md` (PRDs + PLAN + SHAKEOUT) so any
        # future PR that introduces a typo in either the book or the
        # operator-facing docs surface fails fast. New domain words
        # land via a cspell.json edit on the same PR.
        uses: streetsidesoftware/cspell-action@v6
        with:
          config: cspell.json
          files: |
            book/src/**/*.md
            docs/**/*.md

  security-audit:
    name: security audit (gosec + govulncheck + gitleaks)
    # Sprint 6 (PLAN.md § "Sprint 6" — hardening + v1.0 cut prep):
    # the v1.0-readiness security gate. Runs on every PR + push to
    # main; surfaces three classes of regression before tag time:
    #
    #   1. gosec — static analysis for the well-known go security
    #      anti-patterns (G104 unchecked errors, G304 file-inclusion,
    #      G306 file perms, G402 TLS InsecureSkipVerify, G404 weak
    #      RNG, ...). Tunable via `.gosec.yaml` if needed; the
    #      default ruleset is what `gosec ./...` produces.
    #   2. govulncheck — Go's official module-graph vulnerability
    #      scanner. Reports any module that lands a CVE per the
    #      official Go vulnerability database. Stricter than the
    #      `go list -m -u all` scan because it cross-references
    #      symbol-level reachability — only fails on vulns the
    #      binary actually exercises.
    #   3. gitleaks — secret-scan over the full repo tree, including
    #      git history (depth-1 by default; tunable). Catches AWS
    #      access-key IDs, generic API tokens, SSH private keys,
    #      ...). Mirrors what an integrator's pre-tag `gitleaks
    #      detect --redact` run would catch.
    #
    # All three steps run with `continue-on-error: false` (the
    # default) — the v1.0 gate posture per PLAN.md § Sprint 6 is
    # "gosec ./... clean; secrets scan clean". A finding fails the
    # job, blocks the PR, and surfaces in the Actions tab as a
    # red-x check.
    #
    # Live-AWS validation is NOT exercised here — those checks gate
    # on the operator-run PRD 07 spike. This job is the static
    # offline gate; the runtime gate is the spike.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs the full git history to scan past commits
          # (the default fetch-depth: 1 only gives the worktree, not
          # the history). 0 means "all history". govulncheck +
          # gosec only need the worktree, but the cost of the extra
          # fetch is bounded (~5 MB repo today).
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gosec (Go static security analyzer)
        # The official upstream-maintained action; pins to a tagged
        # release (no @master). Default args run `gosec ./...` over
        # the whole module; `-fmt sarif` would emit GH Code Scanning
        # output, but for now we just fail-on-finding to keep the
        # surface simple. Add a `.gosec.yaml` at repo root if a
        # finding needs to be suppressed with a rationale.
        uses: securego/gosec@master
        with:
          args: ./...

      - name: govulncheck (Go vulnerability scanner)
        # Reachability-aware; reports only vulns the binary
        # actually exercises. Driven by the official upstream
        # action which installs the latest `govulncheck` binary
        # and runs it against `./...`.
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          # Default `./...` covers cmd/ + internal/.
          check-latest: true

      - name: gitleaks (secret scan)
        # Scans the full git history for committed secrets. Uses
        # the upstream-maintained gitleaks-action; runs in default
        # mode (no license required for public repos). A finding
        # fails the job; the integrator triages from the Actions
        # log + redacted secret patterns. Suppression rationale,
        # if any, lives in `.gitleaks.toml` at repo root.
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
