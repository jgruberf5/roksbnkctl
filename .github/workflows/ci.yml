name: CI

# Runs on every PR and on push to main/staging. staging is the always-on
# integration/build branch (PRs target staging; staging promotes to main
# weekly).

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

# Cancel superseded runs: a new push to the same ref aborts the in-flight
# run instead of leaving overlapping full matrices churning.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: vet + fmt + staticcheck + test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Track go.mod's `go` directive — testcontainers-go's
          # transitive otel deps require Go 1.25+, and pinning here
          # would diverge silently from go.mod. setup-go reads the
          # directive and downloads a matching toolchain.
          go-version-file: go.mod
          cache: true

      - name: Resolve modules
        run: |
          go mod download
          go mod verify

      - name: go vet
        run: go vet ./...

      - name: gofmt
        # Fail if any file is not gofmt-clean. `tee` keeps the diff in the
        # log so reviewers can see exactly what's wrong.
        run: gofmt -d -l . | tee /tmp/gofmt.diff && test ! -s /tmp/gofmt.diff

      - name: staticcheck
        # Pinned via the go.mod `tool` directive — the version travels with
        # the source tree, so `make lint` locally and this CI step run the
        # exact same binary. No pin drift between local and CI.
        run: go tool staticcheck ./...

      - name: go test
        # -race catches data races; cheap to run on the unit suite. The
        # wildcard picks up every package's tests automatically.
        run: go test -race ./...

      - name: go build
        # Build everything (cmd/ + internal/) to catch any unused-import
        # or undefined-symbol issues that vet/test missed.
        run: go build ./...

  integration:
    name: integration (testcontainers — sshd)
    needs: test
    # Linux only: testcontainers-go on macOS GitHub runners requires Docker
    # Desktop, which isn't installed on the hosted images. Windows runners
    # have similar Docker-availability gaps. Linux runners ship Docker by
    # default, so we get a free integration tier on every push to main and
    # on same-repo PRs.
    #
    # Skipped on PRs from forks: the `head.repo.full_name == repository`
    # check below excludes those. Forks would otherwise hit Docker rate
    # limits without the right secrets and produce noisy red-x checks for
    # contributions that don't even touch internal/remote.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      # Disable the testcontainers-go `testcontainers/ryuk` reaper. On
      # ephemeral GitHub-hosted runners the runner VM is discarded after
      # the job, so leaked containers can't survive — the reaper's only
      # job is to clean up against long-lived hosts. Disabling it kills
      # the docker-hub `testcontainers/ryuk:<v>` image pull that produced
      # the intermittent `429 too many requests` flake on
      # `TestIntegration_Connect_Whoami`.
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Track go.mod's `go` directive rather than hard-coding here —
          # the testcontainers-go dependency chain (docker → otel) pulls
          # in a recent toolchain requirement; pinning a stale version
          # in this YAML would diverge silently.
          go-version-file: go.mod
          cache: true

      - name: go test (integration tag)
        # 5m wall budget covers image pull (~30s on a cold runner) +
        # six test cases × ~20s each. Bumps if we add tests; reduce
        # only after measuring.
        run: go test -tags integration -timeout 5m ./internal/remote/...

  docker-backend:
    name: integration (docker backend)
    needs: test
    # Linux-only mirror of the existing integration job, scoped to the
    # docker backend tests under `internal/exec/`. These spin short-lived
    # busybox containers via the docker backend and assert the
    # credential-no-leak invariant. Skipped on PRs from forks for the
    # same reasons as the `integration` job above.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Pre-pull test images
        # The integration tests use busybox:1.36 (bind-mount round-trip
        # probe) — pre-pull on the host docker daemon so the first run
        # inside Go's 90s context budget doesn't time out on a cold
        # Docker Hub pull.
        run: docker pull busybox:1.36

      - name: go test (integration tag — exec/docker)
        # The tests inside this package self-skip when `docker info`
        # fails, so the job is safe even on a runner without a daemon.
        # 5m matches the existing integration job's budget.
        run: go test -tags integration -timeout 5m ./internal/exec/...

  aws-mocked:
    name: integration (aws — mocked sdk)
    needs: test
    # Exercises the `internal/aws/` SDK helpers (STS/EC2/EKS/VPC/S3/IAM)
    # against mocked aws-sdk-go-v2 clients — the S3 supply-chain helpers
    # (`PutObject`, `HeadObject`) and the IRSA / OIDC readers
    # (`GetOIDCProvider`, `HasIRSARole`) included. NO LIVE AWS: fake API
    # responders are injected via the middleware seam (or hand-rolled
    # interfaces in test files). This job runs on every PR and push because
    # it needs no credentials, no network egress to AWS, and no runtime
    # daemon — only the Go toolchain.
    #
    # If a future test calls an AWS API (e.g. `sts.GetCallerIdentity`,
    # `s3.PutObject`, `iam.GetOpenIDConnectProvider`) without a mock, this
    # job times out hitting the real endpoint with no creds — the signal to
    # add the missing mock rather than weaken the gate.
    #
    # A localstack-backed tier (a real HTTP endpoint to round-trip S3 + IAM
    # against, without a real AWS account) is a possible future addition;
    # the mocked-only path keeps the CI surface free of Docker-in-CI cost
    # and flake.
    runs-on: ubuntu-latest
    env:
      # Belt-and-braces: if a test path leaks past its mock, these
      # fake creds let the SDK construct a Signer without panicking on
      # an empty default-chain resolve, while still failing closed at
      # the network layer (the fake key would 403 a real AWS endpoint).
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_SESSION_TOKEN: testing
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go test (integration tag — internal/aws)
        # 3m budget covers the mocked-SDK suite — no image pulls, no
        # network. The wildcard `./internal/aws/...` picks up every test in
        # the package. Bump if the suite grows; reduce only after measuring.
        run: go test -tags integration -timeout 3m ./internal/aws/...

  k8s-backend:
    name: integration (k8s backend — kind)
    needs: test
    # Linux-only kind-based integration job for the K8s backend. Uses
    # helm/kind-action to spin an ephemeral kind cluster, then runs the
    # integration-tagged tests under internal/exec and internal/cli (the
    # latter exercises `awsbnkctl ops install/show/uninstall` end-to-end).
    #
    # Skipped on PRs from forks for the same reasons as the `integration`
    # job above — kind images pulled from upstream registries hit rate
    # limits without GHCR credentials.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: helm/kind-action@v1
        with:
          wait: 120s
          version: v0.24.0

      - name: Pre-load test images into kind
        # Pull busybox:1.36 on the host docker daemon, then `kind load`
        # it into the kind node so kubelet doesn't have to pull from
        # Docker Hub (rate-limited on cold runners, often times out
        # against the 3m k8sJobReadyTimeout in internal/exec/k8s.go).
        # The same pull also serves the docker-backend integration
        # test that runs alongside in this job (busybox bind-mount
        # round-trip).
        run: |
          docker pull busybox:1.36
          kind load docker-image busybox:1.36 --name chart-testing

      - name: go test (integration tag — exec/k8s + cli/ops)
        # Tests self-skip when no kubeconfig is reachable, so a kind
        # bring-up failure surfaces as a yellow-skip rather than a red
        # fail (still investigable from the kind-action logs above).
        # 10m budget covers image pulls + ops-pod scheduling + the
        # full ops install/show/uninstall lifecycle.
        run: go test -tags integration -timeout 10m ./internal/exec/... ./internal/cli/...

  test-dryrun:
    name: test-dryrun (awsbnkctl test {connectivity,dns,throughput} --dry-run)
    needs: test
    # The test-surface gate: asserts `awsbnkctl test
    # {connectivity,dns,throughput} --dry-run` resolves a workspace config
    # and emits a sensible "would probe X" plan against fake hosts without
    # panicking and without making real network calls. No live network
    # egress — a fake workspace is materialised under $HOME/.awsbnkctl with
    # entries pointing at non-resolving names; the dry-run path is expected
    # to enumerate the would-be probes and exit-0. Live-AWS exercise of the
    # same surface is the operator-run validation, not this offline gate.
    runs-on: ubuntu-latest
    env:
      # Mirror of aws-mocked / full-up-dryrun: fake creds so any
      # SDK signer construction succeeds; AWS calls (if any leak past
      # the dry-run gate) will 403 rather than time out.
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_SESSION_TOKEN: testing
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build awsbnkctl
        # Build to ./bin/awsbnkctl, matching the command lines the
        # dry-run steps below exercise verbatim.
        run: |
          mkdir -p bin
          go build -o bin/awsbnkctl ./cmd/awsbnkctl

      - name: Materialise fake workspace
        # Build a minimal workspace config the test verbs can load
        # without needing a real AWS context. The DNS + connectivity
        # suites read `test.connectivity.extra_hosts` and
        # `test.dns.default_target`; throughput reads
        # `test.throughput.{image,duration,streams}` plus the
        # cluster.name workspace field. A fresh HOME isolates the run
        # from any local awsbnkctl state on the runner.
        #
        # Schema reference: `internal/config/workspace.go::Workspace`
        # uses a top-level `cluster:` block (Name/Create) and an
        # `aws:` block (Region/Profile). The on-disk layout is
        # `~/.awsbnkctl/<workspace>/config.yaml` (per-workspace) and
        # `~/.awsbnkctl/config.yaml` (global, with
        # `current_workspace:` pointer). We pass -w ci-dryrun on the
        # command line so the test verbs pick up the workspace
        # directly — no global-config materialisation needed.
        run: |
          set -eo pipefail
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME/.awsbnkctl/ci-dryrun"
          cat > "$HOME/.awsbnkctl/ci-dryrun/config.yaml" <<'YAML'
          cluster:
            create: false
            name: ci-dryrun-cluster
          aws:
            region: us-east-1
          test:
            connectivity:
              extra_hosts:
                - https://dry-run.example.invalid/health
                - https://gslb.dry-run.example.invalid/
            dns:
              default_target: dry-run.example.invalid
            throughput:
              duration: 5
              streams: 1
          YAML

      - name: awsbnkctl test connectivity --dry-run
        # Asserts (a) exit-0, (b) the would-probe planning output names
        # the configured hosts. The dry-run path must NOT make real
        # HTTP calls — the .invalid TLD guarantees a network resolution
        # failure if the dry-run gate leaks past plan-only mode.
        run: |
          set -eo pipefail
          export HOME="$RUNNER_TEMP/home"
          mkdir -p artifacts
          ./bin/awsbnkctl -w ci-dryrun test connectivity --dry-run \
            2>&1 | tee artifacts/test-connectivity-dryrun.log
          grep -qiE 'would probe|would check|dry[- ]run|plan' \
            artifacts/test-connectivity-dryrun.log
          grep -q 'dry-run.example.invalid' \
            artifacts/test-connectivity-dryrun.log

      - name: awsbnkctl test dns --dry-run
        # Asserts the DNS suite enumerates the configured target
        # (default_target) and resolver vantages without sending
        # an actual query.
        run: |
          set -eo pipefail
          export HOME="$RUNNER_TEMP/home"
          ./bin/awsbnkctl -w ci-dryrun test dns --dry-run \
            2>&1 | tee artifacts/test-dns-dryrun.log
          grep -qiE 'would probe|would query|dry[- ]run|plan' \
            artifacts/test-dns-dryrun.log
          grep -q 'dry-run.example.invalid' \
            artifacts/test-dns-dryrun.log

      - name: awsbnkctl test throughput --dry-run
        # Asserts the iperf3 suite enumerates the would-deploy
        # fixture (namespace + image + mode) without actually
        # creating the in-cluster Pod or contacting the k8s
        # API. The "would deploy" planning text is the visible
        # marker.
        run: |
          set -eo pipefail
          export HOME="$RUNNER_TEMP/home"
          ./bin/awsbnkctl -w ci-dryrun test throughput --dry-run \
            2>&1 | tee artifacts/test-throughput-dryrun.log
          grep -qiE 'would deploy|would probe|dry[- ]run|plan' \
            artifacts/test-throughput-dryrun.log
          grep -qiE 'iperf3|throughput' \
            artifacts/test-throughput-dryrun.log

      - name: Upload dry-run logs
        # Always upload so a red run leaves debug context behind.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-dryrun-logs
          path: artifacts/
          if-no-files-found: warn

  windows-build:
    name: windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go build ./...

  goreleaser-check:
    name: goreleaser config sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          # `check` validates .goreleaser.yml without producing artefacts.
          # Catches typos and template breaks before tag time.
          args: check

  docs-spellcheck:
    name: docs cspell
    # Every PR runs cspell over the operator-facing docs surface so an
    # unknown-word regression surfaces at PR-review time. New domain
    # words land via a cspell.json edit on the same PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: cspell (docs/**/*.md + README + CONTRIBUTING)
        # Hard-fail on any unknown-word finding.
        uses: streetsidesoftware/cspell-action@v6
        with:
          config: cspell.json
          files: |
            docs/**/*.md
            README.md
            CONTRIBUTING.md

  security-audit:
    name: security audit (gosec + govulncheck + gitleaks)
    # The security gate. Runs on every PR + push; surfaces three classes
    # of regression before tag time:
    #
    #   1. gosec — static analysis for the well-known go security
    #      anti-patterns (G104 unchecked errors, G304 file-inclusion,
    #      G306 file perms, G402 TLS InsecureSkipVerify, G404 weak
    #      RNG, ...). Tunable via `.gosec.yaml` if needed; the
    #      default ruleset is what `gosec ./...` produces.
    #   2. govulncheck — Go's official module-graph vulnerability
    #      scanner. Reports any module that lands a CVE per the
    #      official Go vulnerability database. Stricter than the
    #      `go list -m -u all` scan because it cross-references
    #      symbol-level reachability — only fails on vulns the
    #      binary actually exercises.
    #   3. gitleaks — secret-scan over the full repo tree, including
    #      git history (depth-1 by default; tunable). Catches AWS
    #      access-key IDs, generic API tokens, SSH private keys,
    #      ...). Mirrors what an integrator's pre-tag `gitleaks
    #      detect --redact` run would catch.
    #
    # All three steps run with `continue-on-error: false` (the default):
    # the gate posture is "gosec ./... clean; secrets scan clean". A
    # finding fails the job, blocks the PR, and surfaces in the Actions tab
    # as a red-x check. This is the static offline gate; live-AWS
    # validation is exercised separately by the operator.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs the full git history to scan past commits
          # (the default fetch-depth: 1 only gives the worktree, not
          # the history). 0 means "all history". govulncheck +
          # gosec only need the worktree, but the cost of the extra
          # fetch is bounded (~5 MB repo today).
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gosec (Go static security analyzer)
        # The official upstream-maintained action, pinned to a tagged
        # release (not @master) for supply-chain stability. Default args
        # run `gosec ./...` over the whole module; `-fmt sarif` would emit
        # GH Code Scanning output, but for now we just fail-on-finding to
        # keep the surface simple. Add a `.gosec.yaml` at repo root if a
        # finding needs to be suppressed with a rationale.
        uses: securego/gosec@v2.27.1
        with:
          args: ./...

      - name: govulncheck (Go vulnerability scanner)
        # Reachability-aware; reports only vulns the binary actually
        # exercises. Run directly (not via golang/govulncheck-action) so the
        # scan uses the go.mod-pinned toolchain installed by the setup-go
        # step above. The wrapper action re-installs the newest manifest Go,
        # which can lag a patched release and re-flag stdlib CVEs that the
        # go.mod pin has already fixed.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go version
          govulncheck ./...

      - name: gitleaks (secret scan)
        # Scans the full git history for committed secrets. Uses
        # the upstream-maintained gitleaks-action; runs in default
        # mode (no license required for public repos). A finding
        # fails the job; the integrator triages from the Actions
        # log + redacted secret patterns. Suppression rationale,
        # if any, lives in `.gitleaks.toml` at repo root.
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
