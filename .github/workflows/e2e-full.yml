name: Full E2E

# Placeholder for the full live-apply end-to-end run (provision a real
# EKS cluster, install BNK, drive traffic, tear down).
#
# The offline regression surface for the lifecycle and test verbs lives
# in .github/workflows/ci.yml and runs on every PR:
#   - test-dryrun    — awsbnkctl test {connectivity,dns,throughput} --dry-run
#   - security-audit — gosec + govulncheck + gitleaks
#
# The live-apply tier needs a real AWS account, F5 supply-chain
# credentials, and several minutes of cluster bring-up, so it is run by
# an operator rather than on every PR. This workflow keeps a stable
# manual trigger surface (workflow_dispatch + release/** push) and emits
# a short banner until a live driver is wired in.

on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: 'AWS region for the test cluster (e.g. ap-southeast-2)'
        required: true
        default: 'ap-southeast-2'
      teardown_on_success:
        description: 'Tear down the cluster after a green run (false leaves it up for inspection)'
        required: false
        default: 'true'
        type: boolean
  push:
    branches:
      - 'release/**'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-e2e:
    name: Full E2E (live-apply tier; manual operator-run)
    runs-on: ubuntu-latest
    # Gate to this repo so cross-repo PRs don't try to run it.
    if: github.repository == 'JLCode-tech/awsbnkctl'
    steps:
      - uses: actions/checkout@v4

      - name: Status banner
        run: |
          echo "════════════════════════════════════════════════════════════"
          echo "Full E2E — live-apply tier (operator-run)"
          echo "════════════════════════════════════════════════════════════"
          echo "Offline regression of the lifecycle + test verbs runs on every"
          echo "PR via ci.yml (test-dryrun, aws-mocked, security-audit)."
          echo ""
          echo "The live-apply run provisions a real EKS cluster, installs BNK,"
          echo "drives traffic, and tears down. It requires AWS credentials and"
          echo "F5 supply-chain files, so it is run by an operator with:"
          echo "    awsbnkctl up   --config examples/demo/cluster.yaml"
          echo "    awsbnkctl demo run --all -f examples/demo/cluster.yaml"
          echo "    awsbnkctl down --config examples/demo/cluster.yaml --yes"
          exit 0
