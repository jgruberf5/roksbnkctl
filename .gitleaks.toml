# gitleaks configuration for awsbnkctl.
# CI runs gitleaks via the security-audit job in .github/workflows/ci.yml.
# This file extends the default ruleset and allowlists known false positives.
title = "awsbnkctl gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = """
internal/exec/k8s.go holds only exec-backend plumbing — e.g. the k8sLongLivedEnv
env-var sentinel ("AWSBNKCTL_K8S_LONG_LIVED=1") on RunOpts.Env — and no credential
material. The const was renamed away from "...Key" so gitleaks' generic-api-key rule
no longer matches; this path-scoped allowlist is a version-stable belt-and-suspenders
(regexTarget=line is honored by gitleaks 8.30 but not the CI-pinned 8.24.3).
"""
paths = [
  '''internal/exec/k8s\.go''',
]
