# gitleaks configuration for awsbnkctl.
# CI runs gitleaks via the security-audit job in .github/workflows/ci.yml.
# This file extends the default ruleset and allowlists known false positives.
title = "awsbnkctl gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = """
Internal env-var-name sentinels, not credentials. internal/exec/k8s.go's
k8sLongLivedKey is the literal env key "AWSBNKCTL_K8S_LONG_LIVED=1" used as a
plumbing flag on RunOpts.Env — the generic-api-key rule flags it on entropy +
the "Key" identifier name, but it carries no secret material.
"""
regexes = [
  '''AWSBNKCTL_K8S_LONG_LIVED=1''',
]
